name: Compare original packages manually

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence:
    name: Equivalence (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Install the Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install the package, its extras and the reference packages
        run: uv sync --locked --all-extras --group dev --group reference

      - name: Run the equivalence tests
        run: uv run --no-sync pytest tests/equivalence
